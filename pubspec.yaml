name: kelime_islem_game
description: "A new Flutter project."
publish_to: 'none'

version: 1.0.0+5

environment:
  sdk: ^3.5.0

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  shared_preferences: 2.2.3
  uuid: ^4.6.0
  audioplayers: ^5.2.1
  confetti: ^0.7.0
  
  # Firebase paketleri tam uyumlu sürümlere sabitlendi
  firebase_core: ^3.10.1
  firebase_auth: ^5.4.1
  cloud_firestore: ^5.6.2
  firebase_app_check: ^0.3.2+10
  
  flutter_dotenv: ^6.0.1
  flutter_secure_storage: 9.0.0
  firebase_crashlytics: ^4.3.10
  google_mobile_ads: ^9.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^4.0.0
  flutter_launcher_icons: ^0.13.1

flutter:
  uses-material-design: true

  assets:
    - assets/words_tr.json
    - assets/images/logo.png
    - assets/images/app_icon.jpg
    - assets/images/splash_bg.png
    - assets/sounds/
    - assets/avatars/
    - assets/borders/
    - .env

  # Nunito (SIL OFL 1.1; lisans: assets/fonts/OFL.txt) yerel olarak paketlenir,
  # internet bağlantısı gerekmez.
  fonts:
    - family: Nunito
      fonts:
        - asset: assets/fonts/Nunito-Regular.ttf
          weight: 400
        - asset: assets/fonts/Nunito-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Nunito-Bold.ttf
          weight: 700
        - asset: assets/fonts/Nunito-ExtraBold.ttf
          weight: 800

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/images/app_icon.jpg"